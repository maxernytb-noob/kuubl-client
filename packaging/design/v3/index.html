<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Kuubl v3 – návrhy</title>
<!-- Design mockups for the Kuubl redesign: ?v=a | b | c. Open through vite: /packaging/design/v3/ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700;900&family=Inter:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700;800&family=Inter+Tight:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --ember: #f0661f; --ember-2: #ff8a3d; --coal: #131210; --coal-2: #1c1a17; --coal-3: #26231f; --bone: #ece6da; --bone-2: #d9d1c1; --ink-soft: #8b8478; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { width: 1280px; height: 800px; overflow: hidden; }
img { display: block; }
#root { height: 100%; }
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ================= A: "Kýbl" — chunky stickers, hard offset shadows, floating dock ================= */
.a { font-family: "Bricolage Grotesque", sans-serif; background: var(--coal); color: var(--bone); height: 100%; display: grid; grid-template-columns: 96px 1fr; position: relative; }
.a::before { content: ""; position: absolute; inset: 0; background: radial-gradient(900px 500px at 85% -10%, rgba(240,102,31,.18), transparent 60%), radial-gradient(600px 400px at 0% 110%, rgba(240,102,31,.08), transparent 60%); pointer-events: none; }
.a .dock { margin: 16px 0 16px 16px; background: var(--coal-2); border: 2.5px solid var(--coal-3); border-radius: 28px; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 10px; position: relative; z-index: 1; }
.a .dock .logo { width: 52px; height: 52px; border-radius: 18px; background: var(--ember); display: grid; place-items: center; box-shadow: 0 4px 0 #a8410d; margin-bottom: 10px; transform: rotate(-6deg); }
.a .dock .logo img { width: 34px; }
.a .dock button { width: 52px; height: 52px; border-radius: 18px; border: 0; background: transparent; color: var(--ink-soft); display: grid; place-items: center; cursor: pointer; position: relative; }
.a .dock button .ico { width: 24px; height: 24px; }
.a .dock button.on { background: var(--bone); color: var(--coal); box-shadow: 0 4px 0 var(--bone-2); }
.a .dock button .lab { position: absolute; left: 64px; background: var(--bone); color: var(--coal); font-weight: 800; font-size: 13px; padding: 6px 10px; border-radius: 10px; white-space: nowrap; opacity: 0; }

.a .dock .sp { flex: 1; }
.a .dock .me { width: 46px; height: 46px; border-radius: 50%; background: #3a2a20; border: 3px solid var(--ember); }
.a main { padding: 26px 32px 0 26px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 22px; }
.a .top { display: flex; align-items: center; gap: 14px; }
.a .hello { font-size: 15px; color: var(--ink-soft); font-weight: 600; }
.a .hello b { display: block; font-size: 30px; color: var(--bone); font-weight: 800; letter-spacing: -.5px; }
.a .search { margin-left: auto; width: 380px; white-space: nowrap; height: 46px; border-radius: 16px; background: var(--coal-2); border: 2.5px solid var(--coal-3); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--ink-soft); font-weight: 600; font-size: 14px; }
.a .search kbd { margin-left: auto; font: 700 11px "Rubik"; background: var(--coal-3); padding: 3px 7px; border-radius: 6px; }
.a .hero { position: relative; height: 330px; border-radius: 30px; overflow: hidden; border: 3px solid var(--bone); box-shadow: 8px 8px 0 var(--ember); }
.a .hero img { width: 100%; height: 100%; object-fit: cover; }
.a .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(19,18,16,.92) 0%, rgba(19,18,16,.55) 45%, transparent 75%); }
.a .hero .in { position: absolute; left: 34px; bottom: 30px; z-index: 1; }
.a .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--ember); color: var(--coal); font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 999px; transform: rotate(-3deg); margin-bottom: 14px; }
.a .hero h1 { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: .95; }
.a .hero p { color: var(--bone-2); font-size: 17px; margin: 8px 0 22px; font-weight: 500; }
.a .play { display: inline-flex; align-items: center; gap: 12px; height: 64px; padding: 0 34px; border-radius: 20px; border: 3px solid var(--coal); background: var(--ember); color: var(--coal); font: 800 24px "Bricolage Grotesque"; letter-spacing: .5px; box-shadow: 0 6px 0 #a8410d; }
.a .play .ico { width: 24px; height: 24px; fill: var(--coal); stroke: none; }
.a .ghost { margin-left: 10px; height: 64px; width: 64px; border-radius: 20px; border: 2.5px solid var(--bone); background: transparent; color: var(--bone); display: inline-grid; place-items: center; vertical-align: top; }
.a h2 { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.a h2 small { font-size: 13px; color: var(--ember); font-weight: 700; margin-left: auto; }
.a .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.a .card { background: var(--coal-2); border: 2.5px solid var(--coal-3); border-radius: 22px; overflow: hidden; transition: transform .15s; }
.a .card:nth-child(1) { transform: rotate(-1.2deg); border-color: var(--ember); box-shadow: 5px 5px 0 var(--ember); }
.a .card img { width: 100%; height: 92px; object-fit: cover; }
.a .card div { padding: 11px 14px 13px; }
.a .card b { font-size: 16px; font-weight: 800; display: block; }
.a .card span { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

/* ================= B: "Žhavý" — warm gradient blobs, top pill navigation, Fredoka ================= */
.b { font-family: "Fredoka", sans-serif; background: #1a0f0a; color: var(--bone); height: 100%; position: relative; overflow: hidden; }
.b .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
.b .blob.one { width: 620px; height: 620px; background: var(--ember); right: -160px; top: -260px; }
.b .blob.two { width: 420px; height: 420px; background: #c2185b; left: -160px; bottom: -200px; opacity: .3; }
.b .blob.three { width: 300px; height: 300px; background: #ffb347; left: 45%; top: 40%; opacity: .18; }
.b header { position: relative; z-index: 2; display: flex; align-items: center; padding: 22px 30px; gap: 22px; }
.b header .brand { display: flex; align-items: center; gap: 10px; }
.b header .brand img.i { width: 40px; transform: rotate(-8deg); }
.b header .brand img.w { height: 34px; }
.b nav { display: flex; gap: 4px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); padding: 5px; border-radius: 999px; margin: 0 auto; backdrop-filter: blur(10px); }
.b nav a { padding: 10px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; color: rgba(236,230,218,.7); display: flex; align-items: center; gap: 8px; }
.b nav a .ico { width: 18px; height: 18px; }
.b nav a.on { background: var(--bone); color: #1a0f0a; }
.b header .me { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--ember), #c2185b); padding: 3px; }
.b header .me i { display: block; width: 100%; height: 100%; border-radius: 50%; background: #3a2a20; }
.b main { position: relative; z-index: 1; display: grid; grid-template-columns: 1.35fr 1fr; gap: 26px; padding: 8px 30px 0; }
.b .hero { position: relative; height: 470px; border-radius: 40px; overflow: hidden; }
.b .hero img { width: 100%; height: 100%; object-fit: cover; }
.b .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(26,15,10,.95) 5%, transparent 60%); }
.b .hero .in { position: absolute; left: 34px; right: 34px; bottom: 30px; z-index: 1; }
.b .chip .ico { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }
.b .chip .ico { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }
.b .chip { display: inline-block; background: rgba(255,255,255,.14); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; margin-bottom: 12px; }
.b .hero h1 { font-size: 60px; font-weight: 700; line-height: 1; }
.b .hero p { opacity: .8; font-size: 18px; margin: 8px 0 22px; }
.b .play { display: inline-flex; align-items: center; gap: 12px; height: 66px; padding: 0 40px; border-radius: 999px; border: 0; background: linear-gradient(135deg, var(--ember-2), var(--ember) 55%, #d94b0c); color: #fff; font: 700 24px "Fredoka"; box-shadow: 0 12px 40px rgba(240,102,31,.55), inset 0 2px 0 rgba(255,255,255,.35); }
.b .play .ico { fill: #fff; stroke: none; width: 22px; height: 22px; }
.b .side { display: flex; flex-direction: column; gap: 16px; }
.b .side h2 { font-size: 22px; font-weight: 600; }
.b .inst { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 26px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); }
.b .inst.on { background: rgba(240,102,31,.18); border-color: rgba(240,102,31,.5); }
.b .inst img { width: 64px; height: 64px; border-radius: 20px; object-fit: cover; }
.b .inst b { font-size: 18px; font-weight: 600; display: block; }
.b .inst span { font-size: 14px; opacity: .65; }
.b .inst .go { margin-left: auto; width: 46px; height: 46px; border-radius: 50%; background: var(--bone); color: #1a0f0a; display: grid; place-items: center; }
.b .inst .go .ico { fill: currentColor; stroke: none; width: 16px; height: 16px; }
.b .friends { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 26px; background: rgba(255,255,255,.06); font-weight: 500; font-size: 15px; }
.b .friends i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #1a0f0a; margin-left: -14px; background: #5a3a2a; }
.b .friends i:first-child { margin-left: 0; background: #2a4a3a; }
.b .friends i:nth-child(2) { background: #3a3a5a; }

/* ================= C: "Den" — light bone theme, coal ink, sticker cards, Rubik ================= */
.c { font-family: "Rubik", sans-serif; background: var(--bone); color: var(--coal); height: 100%; display: grid; grid-template-columns: 230px 1fr; }
.c aside { background: var(--coal); color: var(--bone); margin: 14px; border-radius: 30px; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; }
.c aside .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
.c aside .brand img.i { width: 36px; transform: rotate(-8deg); }
.c aside .brand img.w { height: 30px; }
.c aside a { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; font-weight: 500; font-size: 16px; color: rgba(236,230,218,.65); }
.c aside a.on { background: var(--ember); color: var(--coal); font-weight: 700; transform: rotate(-1.5deg); }
.c aside .sec { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: rgba(236,230,218,.35); padding: 14px 14px 4px; }
.c aside .sp { flex: 1; }
.c aside .me { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: rgba(255,255,255,.06); font-weight: 600; }
.c aside .me i { width: 36px; height: 36px; border-radius: 12px; background: var(--ember); }
.c main { padding: 30px 34px 0 20px; display: flex; flex-direction: column; gap: 22px; }
.c .top { display: flex; align-items: flex-end; }
.c .top h1 { font-size: 46px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; }
.c .top h1 em { font-style: normal; color: var(--ember); }
.c .top .pill { margin-left: auto; display: flex; align-items: center; gap: 8px; background: #fff; border: 2.5px solid var(--coal); padding: 10px 16px; border-radius: 999px; font-weight: 600; box-shadow: 3px 3px 0 var(--coal); }
.c .top .pill i { width: 10px; height: 10px; border-radius: 50%; background: #2fbf71; }
.c .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0; border: 3px solid var(--coal); border-radius: 32px; overflow: hidden; background: #fff; box-shadow: 8px 8px 0 var(--coal); height: 320px; }
.c .hero img { width: 100%; height: 100%; object-fit: cover; border-right: 3px solid var(--coal); }
.c .hero .in { padding: 32px 30px; display: flex; flex-direction: column; justify-content: center; }
.c .hero .tag { align-self: flex-start; background: var(--coal); color: var(--bone); padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.c .hero h2 { font-size: 44px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
.c .hero p { color: #6b6457; margin: 10px 0 24px; font-size: 16px; }
.c .play { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; height: 62px; padding: 0 34px; border-radius: 18px; border: 3px solid var(--coal); background: var(--ember); color: var(--coal); font: 900 22px "Rubik"; letter-spacing: 1px; box-shadow: 4px 4px 0 var(--coal); }
.c .play .ico { fill: var(--coal); stroke: none; }
.c .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.c .card { background: #fff; border: 2.5px solid var(--coal); border-radius: 22px; padding: 10px; box-shadow: 4px 4px 0 var(--coal); }
.c .card:nth-child(2) { transform: rotate(1.5deg); }
.c .card:nth-child(4) { transform: rotate(-1deg); }
.c .card img { width: 100%; height: 84px; object-fit: cover; border-radius: 14px; }
.c .card b { display: block; font-weight: 700; font-size: 16px; margin: 9px 4px 1px; }
.c .card span { font-size: 13px; color: #8a8273; margin: 0 4px; }
.c h3 { font-size: 20px; font-weight: 800; }

/* ================= D: "Kovárna" — dark, square, dense (Feather-like direction) ================= */
.d { --bg: #0a0a0b; --p1: #111113; --p2: #17171a; --p3: #202024; --line: #232328; --tx: #ecebe8; --mu: #85858d; font-family: "Inter Tight", "Inter", sans-serif; background: var(--bg); color: var(--tx); height: 100%; display: grid; grid-template-columns: 220px 1fr; font-size: 14px; }
.d aside { background: var(--p1); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.d .brand { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.d .brand img.i { width: 26px; }
.d .brand img.w { height: 24px; }
.d .brand small { margin-left: auto; font: 700 10px "JetBrains Mono", monospace; color: var(--mu); border: 1px solid var(--line); padding: 2px 5px; border-radius: 6px; }
.d .navs { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.d .sec { font-size: 10.5px; font-weight: 700; letter-spacing: 1.6px; color: #55555c; padding: 14px 12px 6px; text-transform: uppercase; }
.d .navs a { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; color: var(--mu); font-weight: 600; position: relative; }
.d .navs a .ico { width: 18px; height: 18px; stroke-width: 2; }
.d .navs a.on { background: var(--p3); color: var(--tx); }
.d .navs a.on::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; background: var(--ember); border-radius: 0 4px 4px 0; }
.d .navs a .cnt { margin-left: auto; font-size: 11px; background: var(--ember); color: #111; font-weight: 800; padding: 1px 6px; border-radius: 6px; }
.d aside .sp { flex: 1; }
.d .acct { margin: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 10px; background: var(--p2); }
.d .acct i { width: 32px; height: 32px; border-radius: 6px; background: #6b4a35; image-rendering: pixelated; }
.d .acct b { display: block; font-size: 13.5px; }
.d .acct span { font-size: 11.5px; color: var(--mu); }
.d .acct .ico { margin-left: auto; width: 16px; color: var(--mu); }
.d main { display: flex; flex-direction: column; min-width: 0; }
.d .bar { height: 64px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.d .bar h1 { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
.d .bar .search { margin-left: 24px; flex: 0 1 380px; height: 36px; background: var(--p2); border: 1px solid var(--line); border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--mu); }
.d .bar .search .ico { width: 16px; }
.d .bar kbd { margin-left: auto; font: 600 10.5px "JetBrains Mono", monospace; border: 1px solid var(--line); padding: 1px 5px; border-radius: 6px; }
.d .bar .ib { margin-left: auto; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--mu); position: relative; }
.d .bar .ib + .ib { margin-left: 0; }
.d .bar .ib .ico { width: 17px; }
.d .bar .ib.dot::after { content: ""; position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); }
.d .content { padding: 22px 24px; display: grid; grid-template-columns: 1fr 290px; gap: 20px; }
.d .hero { grid-column: 1 / -1; position: relative; height: 300px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.d .hero img { width: 100%; height: 100%; object-fit: cover; }
.d .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,11,.96) 0%, rgba(10,10,11,.7) 38%, rgba(10,10,11,0) 70%), linear-gradient(0deg, rgba(10,10,11,.6), transparent 40%); }
.d .hero .in { position: absolute; left: 32px; bottom: 28px; z-index: 1; }
.d .kick { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ember); margin-bottom: 10px; }
.d .kick .ico { width: 14px; height: 14px; }
.d .hero h2 { font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.d .hero p { color: #b3b2ad; margin: 8px 0 22px; font-size: 15px; }
.d .launch { display: inline-flex; height: 52px; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(240,102,31,.25); }
.d .launch button { border: 0; background: var(--ember); color: #111; font: 800 17px "Inter Tight", sans-serif; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; padding: 0 30px; }
.d .launch button .ico { fill: #111; stroke: none; width: 18px; }
.d .launch .ver { background: #d9571a; color: #111; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 700; font-size: 13px; border-left: 1px solid rgba(0,0,0,.25); }
.d .launch .ver .ico { width: 14px; }
.d .meta { position: absolute; right: 24px; bottom: 24px; z-index: 1; display: flex; gap: 8px; }
.d .meta span { background: rgba(10,10,11,.75); border: 1px solid var(--line); padding: 6px 10px; border-radius: 8px; font-size: 12px; color: #c9c8c3; display: flex; align-items: center; gap: 6px; }
.d .meta span .ico { width: 13px; }
.d h3 { font-size: 11.5px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--mu); display: flex; align-items: center; margin-bottom: 10px; }
.d h3 a { margin-left: auto; color: var(--ember); letter-spacing: .5px; text-transform: none; font-size: 12.5px; font-weight: 700; }
.d .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.d .card { background: var(--p1); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.d .card.on { border-color: var(--ember); }
.d .card img { width: 100%; height: 78px; object-fit: cover; }
.d .card div { padding: 9px 11px 10px; }
.d .card b { display: block; font-size: 13.5px; }
.d .card span { font-size: 11.5px; color: var(--mu); display: flex; align-items: center; gap: 5px; }
.d .card span em { font-style: normal; font: 700 10px "JetBrains Mono", monospace; border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; color: #a9a8a3; }
.d .panel { background: var(--p1); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.d .fr { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; }
.d .fr:hover { background: var(--p2); }
.d .fr i { width: 28px; height: 28px; border-radius: 6px; background: #3c5a46; position: relative; }
.d .fr i::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 50%; background: #34c46e; border: 2px solid var(--p1); }
.d .fr.idle i::after { background: #e0a526; }
.d .fr.off i::after { background: #55555c; }
.d .fr b { display: block; font-size: 13px; }
.d .fr span { font-size: 11.5px; color: var(--mu); }
.d .fr .join { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--ember); border: 1px solid rgba(240,102,31,.4); padding: 3px 8px; border-radius: 6px; }

/* ================= E: "Monolit" — graphite pro tool, hairlines, list rows, mono details ================= */
.e { --bg: #0d0d0e; --p1: #121214; --p2: #18181b; --line: #222226; --tx: #e7e6e3; --mu: #7c7c84; font-family: "Inter", sans-serif; background: var(--bg); color: var(--tx); height: 100%; display: grid; grid-template-columns: 60px 1fr 300px; font-size: 13.5px; }
.e .rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
.e .rail img { width: 26px; margin-bottom: 16px; }
.e .rail a { width: 40px; height: 40px; display: grid; place-items: center; color: var(--mu); border-radius: 6px; }
.e .rail a .ico { width: 19px; height: 19px; stroke-width: 1.9; }
.e .rail a.on { color: var(--ember); background: rgba(240,102,31,.1); box-shadow: inset 2px 0 0 var(--ember); }
